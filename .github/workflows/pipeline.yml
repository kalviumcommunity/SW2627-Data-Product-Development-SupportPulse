name: SupportPulse Automated Pipeline

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SupportPulse pipeline
        run: |
          python pipeline.py --input data/raw/customers.csv --output output/pipeline

      - name: Verify pipeline output
        run: |
          test -f output/pipeline/cleaned_data.csv
          test -f output/pipeline/aggregated_metrics.csv
          echo "Pipeline output files verified successfully."

      - name: Upload pipeline output
        uses: actions/upload-artifact@v4
        with:
          name: supportpulse-pipeline-output
          path: output/pipeline/
